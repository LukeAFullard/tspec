site_name: tspec
site_description: Unevenly sampled time-series change detection, turning points, and spectral decomposition with censored-data support.
repo_url: https://github.com/LukeAFullard/tspec
repo_name: LukeAFullard/tspec

theme:
  name: material
  logo: assets/tspec-icon.png
  favicon: assets/tspec-icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Practitioner Guide:
      - Which Method Should I Use?: guide/which-method.md
      - Core Concepts (Zero Math First): guide/concepts.md
      - Common Mistakes & Pitfalls: guide/pitfalls.md
      - Parameter Cheat Sheet: guide/parameters.md
      - Censored Lab Data (<DL / >UL): guide/censored-data.md
      - Interpreting Results & Warnings: guide/interpreting-results.md
  - Domain Tutorials:
      - Water Quality with <DL & Lab Upgrades: tutorials/water-quality-censored.md
      - Satellite Vegetation (NDVI) & Wildfire: tutorials/vegetation-ndvi-wildfire.md
      - Ground Subsidence Turning Points (STPD): tutorials/subsidence-turning-point.md
      - Near-Real-Time Monitoring (JUSTmonitor): tutorials/near-real-time-monitoring.md
      - Combined JUST -> STPD Workflow: tutorials/combined-workflow.md
  - Reference:
      - API Reference: reference/api.md
      - Mathematical Reference: reference/math.md
      - Validation & Parity Summary: reference/validation-summary.md
      - Citations & Attribution: reference/citations.md
